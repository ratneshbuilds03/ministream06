name: MiniStream CI Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test-main-api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./main-api

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: testpassword
          MYSQL_DATABASE: ministream_test_db
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3
      mongodb:
        image: mongo:6.0
        ports:
          - 27017:27017
      redis:
        image: redis:7.0
        ports:
          - 6379:6379
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set Up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        env:
          DATABASE_URL:
          MONGODB_URL:
          MONGODB_DB:
          REDIS_URL:
          SECRET_KEY:
          ALGORITHM:
          ACCESS_TOKEN_EXPIRE_MINUTES: "60"
          AWS_ACCESS_KEY_ID:
          AWS_SECRET_ACCESS_KEY: fake-aws-secret
          AWS_BUCKET_NAME: fake-bucket
          AWS_REGION: ap-south-1
          NOTIFICATION_SERVICE_URL: http://localhost:5001
        run: pip install -r requirements.txt

  build-images:
    runs-on: ubuntu-latest
    needs: test-main-api

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Build main-api image
        run: docker build -t ministream-main-api  ./main-api

      - name: Build notification-service image
        run: docker build -t ministream-notification ./notification-service

      - name: Build complete stack
        run: docker-compose build
