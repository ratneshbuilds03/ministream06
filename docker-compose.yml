services:
  main-app:
    build:
       context: ./main-app
       dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env.docker
    depends_on:
      db:
        condition: service_healthy
      mongodb:
        condition: service_started
      redis:
        condition: service_started
    # volumes:
    #   - ./main-app:/app
    networks:
      - ministream-network

  notification-service:
    build: ./notification-service
    ports:
      - "5001:5001"
    env_file:
      - .env.docker
    networks:
      - ministream-network

  db:
    image: mysql:8.0
    env_file:
      - .env.docker
    environment:
      MYSQL_DATABASE: ministream_db
    ports:
      - "3312:3306"
    healthcheck:
      # test: ["CMD-SHELL", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p$$MYSQL_ROOT_PASSWORD"]
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - ministream-network

  mongodb:
    image: mongo:6.0
    ports:
      - "27021:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - ministream-network

  redis:
    image: redis:7.0
    ports:
      - "6382:6379"
    volumes:
      - redis_data:/data
    networks:
      - ministream-network

volumes:
  mysql_data:
  mongo_data:
  redis_data:

networks:
  ministream-network:
    driver: bridge
